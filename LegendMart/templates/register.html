{% extends "base.html" %}
{% block title %}Register - LegendMart{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h2 class="auth-title">Create a Seller Account</h2>
    <p class="auth-sub">Required before you can upload an account for sale.</p>

    <form method="POST" action="{{ url_for('register') }}" enctype="multipart/form-data" class="auth-form">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="fullname" required placeholder="Juan Dela Cruz">
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" required placeholder="you@email.com">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Password * (min. 6 characters)</label>
          <input type="password" name="password" required>
        </div>
        <div class="form-group">
          <label>Confirm Password *</label>
          <input type="password" name="confirm" required>
        </div>
      </div>

      <div class="form-group">
        <label>Address *</label>
        <input type="text" name="address" required placeholder="Barangay, City, Province">
      </div>

      <div class="form-divider"><span>Payment Method (at least one required)</span></div>

      <div class="form-row">
        <div class="form-group">
          <label>GCash Number</label>
          <input type="text" name="gcash" placeholder="09XXXXXXXXX">
        </div>
        <div class="form-group">
          <label>Maya Number</label>
          <input type="text" name="maya" placeholder="09XXXXXXXXX">
        </div>
      </div>
      <div class="form-group">
        <label>PayPal Email</label>
        <input type="email" name="paypal" placeholder="yourpaypal@email.com">
      </div>

      <div class="form-divider"><span>Valid ID (for verification)</span></div>

      <div class="form-row">
        <div class="form-group">
          <label>ID Type *</label>
          <select name="id_type" required>
            <option value="">-- Select --</option>
            <option>National ID (PhilSys)</option>
            <option>School ID</option>
            <option>Passport</option>
            <option>Driver's License</option>
            <option>Postal ID</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>ID Number *</label>
          <input type="text" name="id_number" required placeholder="ID number">
        </div>
      </div>

      <div class="form-group">
        <label>Upload ID Picture (png/jpg/pdf)</label>
        <input type="file" name="id_image" accept=".png,.jpg,.jpeg,.gif,.pdf" class="file-input">
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block">Register</button>
      <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </form>
  </div>
</section>
{% endblock %}
